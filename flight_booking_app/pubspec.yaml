name: flight_booking_app
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.11.5
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^7.0.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  get_it: ^9.2.1
  shared_preferences: ^2.5.5
  dio: ^5.9.2
  flutter_secure_storage: ^10.1.0
  retrofit: ^4.9.2
  injectable: ^3.0.0
  dartz: ^0.10.1
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  retrofit_generator: ^10.2.6
  json_serializable: ^6.13.2

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/splash.jpg
    - assets/images/onboarding_1.avif
    - assets/images/onboarding_2.webp
    - assets/images/onboarding_3.webp
    - assets/images/logo.png

    - assets/data/mock/onboarding.json
